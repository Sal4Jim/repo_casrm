<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CASRM - Sistema de Gestión de Productos para Helados</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome (íconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Fuente Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Choices.js (para selects mejorados) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/gestion-productos.css">
    <link rel="icon" href="images/logoCASRM.png" type="image/png">
</head>

<body>

    <!-- Contenedor para el encabezado dinámico -->
    <div id="header-placeholder"></div>

    <!-- Contenido principal -->
    <div class="container mb-5">
        <div class="card">
            <div class="card-header d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2">
                <h4 class="mb-0"><i class="fas fa-boxes me-2"></i> Gestión de Productos</h4>
                <div class="d-flex flex-column flex-md-row gap-2 align-items-md-center">
                    <button id="btnNuevo" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productModal">
                        <i class="fas fa-plus-circle me-2"></i> Nuevo producto
                    </button>
                    <!-- Botón para abrir el modal de nueva categoría (colócalo junto al botón "Nuevo") -->
                    <button id="btnCrearCategoria" class="btn btn-secondary ms-md-2" data-bs-toggle="modal"
                        data-bs-target="#modalCategoria">
                        <i class="fas fa-folder-plus me-2"></i> Crear categoría
                    </button>
                    <!-- Botón para exportar a CSV -->
                    <button id="btnExportarCSV" class="btn btn-success ms-md-2">
                        <i class="fas fa-file-csv me-2"></i> Exportar a CSV
                    </button>
                </div>
            </div>

            <div class="card-body">
                <!-- Filtros -->
                <div class="row mb-4">
                    <div class="mb-3 mb-md-0">
                        <div class="search-box">
                            <input type="text" id="searchInput" class="form-control"
                                placeholder="Buscar por Nombre del Producto">
                            <i class="fas fa-search"></i>
                        </div>
                    </div>
                </div>

                <!-- Tabla de productos -->
                <div class="table-responsive">
                    <table class="table table-hover table-striped">
                        <thead>
                            <tr>
                                <th id="sort-name">Nombre <i class="fas fa-sort"></i></th>
                                <th id="sort-category">Categoría <i class="fas fa-sort"></i></th>
                                <th>Presentación</th>
                                <th>Precio de Proveedor</th>
                                <th>Precio de Venta</th>
                                <th>Stock</th>
                                <th class="actions-column">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="productsTable">
                            <!-- Las filas de productos se generan dinámicamente desde JS -->
                        </tbody>
                    </table>
                </div>

                <!-- Paginación -->
                <nav aria-label="Page navigation" class="mt-4">
                    <ul class="pagination justify-content-center" id="pagination"></ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Modal: Formulario de producto -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="productModalLabel">
                        <i class="fas fa-plus-circle me-2"></i> Nuevo Producto
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="productForm">
                        <!-- Campo oculto para guardar el ID del producto en modo edición -->
                        <input type="hidden" id="productId">
                        <div class="row mb-3">
                            <div class="col-md-6">  
                                <label for="productName" class="form-label">Nombre*</label>
                                <input type="text" class="form-control" id="productName" required
                                    oninput="this.value = this.value.replace(/[^a-zA-Z0-9]/g, '')"
                                    pattern="[A-Z]*" title="Solo se permiten letras, números y puntos.">
                            </div>
                            <div class="col-md-6">
                                <label for="productCategory" class="form-label">Categoría*</label>
                                <div class="input-group">
                                    <select class="form-select" aria-label="Large select example" id="productCategory"
                                        required>
                                        <!-- Las opciones se cargarán dinámicamente desde la API -->
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="productPresentation" class="form-label">Presentación*</label>
                                <input type="text" class="form-control" id="productPresentation"
                                    placeholder="Ej: caja, saco 20KG, pqt 1.2kg, etc..." required
                                    oninput="this.value = this.value.toUpperCase().replace(/[^A-Z0-9.]/g, '')"
                                    pattern="[A-Z0-9.]*" title="Solo se permiten letras, números y puntos.">
                            </div>
                            <div class="col-md-6">
                                <label for="productStock" class="form-label">Stock*</label>
                                <input type="number" class="form-control" id="productStock" min="0" 
                                    placeholder="Cantidad inicial" required>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="productBuyPrice" class="form-label">Precio de Proveedor*</label>
                                <div class="input-group">
                                    <span class="input-group-text">S/.</span>
                                    <input type="number" class="form-control" id="productBuyPrice" min="0" step="0.01"
                                        placeholder="0.00" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="productSellPrice" class="form-label">Precio de Venta*</label>
                                <div class="input-group">
                                    <span class="input-group-text">S/.</span>
                                    <input type="number" class="form-control" id="productSellPrice" min="0" step="0.01"
                                        placeholder="0.00" required>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnSave">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- =============== SECCIÓN: MODAL - CREAR CATEGORÍA =============== -->
    <div class="modal fade" id="modalCategoria" tabindex="-1" aria-labelledby="modalCategoriaLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="addCategoryForm" autocomplete="off">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalCategoriaLabel">
                            <i class="fas fa-folder-plus me-2"></i> Nueva Categoría
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <label for="categoryNameInput" class="form-label">Nombre de la categoría</label>
                        <input type="text" id="categoryNameInput" class="form-control"
                            placeholder="Ej: Cono, Premezcla ..." required>
                        <div id="categorySuccess" class="text-success mt-2" style="display:none; font-size:0.95em;">
                            <i class="fas fa-check-circle"></i> Categoría agregada
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Agregar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- =============== SECCIÓN: PIE DE PÁGINA =============== -->
    <footer class="text-center p-3 mt-5">
        <div class="container">
            <p class="mb-0">© 2025 CASRM - Sistema de Gestión para Productos de Heladería</p>
        </div>
    </footer>

    <!-- Scripts -->
    <!-- Bootstrap JS (obligatorio) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SweetAlert2 (para confirmaciones) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Choices.js (para selects mejorados) -->
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

    <!-- Script principal para cargar componentes comunes -->
    <script src="js/main.js"></script>

    <!-- Tu script personalizado -->
    <script src="js/gestion-productos.js"></script>

</body>

</html>
